# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    # branches: [ "main" ]

# env:
#   PIP_CACHE_DIR: /root/.cache/pip

permissions: # for junit test execution
  contents: read
  checks: write
 
jobs:
  # runs instead of format checking function (lint is a naming convention)
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install .[test,lint]
      # add this for spacing and other conventions

      # - name: Check Black formatting
      #   run: black --check src/ tests/

      - name: Check Ruff linting
        run: ruff check src/ tests/
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Run tox tests
        run: |
          pip install tox
          TOXENV=py$(echo ${{ matrix.python-version }} | tr -d '.')
          tox -r -e $TOXENV

      - name: Check coverage threshold (80%)
        run: |
          COVERAGE=$(grep "TOTAL" coverage/$TOXENV/coverage.txt | awk '{print $NF}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage is below 80% threshold"
            exit 1
          else
            echo "Coverage meets 80% threshold"
          fi
      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: report/py*/report.xml
          include_passed: true
          detailed_summary: true



  build-job:  
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Build package
        run: |
          pip install .[build]
          python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
      # Github only offers 500 MB storage for the built files. adjust retention for a cost effective plan
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/
          retention-days: 90